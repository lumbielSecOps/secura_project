<!DOCTYPE html>
<html>
<head>
    <title>Secura Patient Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<!--patient registration page-->
<body class="login-page">
<div class="login-card">
    <h1>Create account</h1>
    <p class="login-subtitle" style="font-size:13px;color:#555;">Register as a patient to securely receive medical documents.</p>

    <label>Username:</label>
    <input id="username" type="text" placeholder="Enter username"><br>

    <label>Email:</label>
    <input id="email" type="email" placeholder="Enter email"><br>

    <label>Password:</label>
    <input id="password" type="password" placeholder="Create password"><br>

    <button onclick="registerPatient()">Register Patient Account</button>
    
    <button type= "button" onclick='window.location.href="index.html"'>Back to Login</button>

    <div id="msg" class="msg" style="display:none"></div>
</div>

<script>
//Function to handle patient registration by sending data to backend API
async function registerPatient() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const m = document.getElementById("msg");
    m.style.display = "block";

    if (!username || !email || !password) {
        m.className = "msg error";
        m.textContent = "Please fill in all fields.";
        return;
    }
    
    const res = await fetch(
        `http://127.0.0.1:8000/patient-register?username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
        {
            method: "POST",
            headers: { "accept": "application/json" }
        }
    );

    const data = await res.json();

    if (res.ok) {
        m.className = "msg success";
        m.textContent = "Patient account created successfully. Redirecting to login...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);
    } else {
        m.className = "msg error";
        m.textContent = data.detail || "Registration failed.";
    }
}
</script>
</body>
</html>
