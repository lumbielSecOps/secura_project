<!DOCTYPE html>
<html>

<head>
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h2>Doctor Dashboard</h2>
        <p style="font-size:13px;color:#555;margin-bottom: 20px;">Send a medical document to patient</p>

        <!--Add username field-->
        <label for="doctor_id">Doctor ID:</label>
        <input id="sender_id" type="number" placeholder="Doctor ID"><br>
        <label for="patient_id">Patient ID:</label>
        <input id="receiver_id" type="number" placeholder="Patient ID"><br>

        <label for="file">Select Document:</label>
        <input id="file" type="file" onchange="showSelectedFile()"><br>

        <div id="selected-file" style="font-size: 13px; color: #555; margin-bottom: 4px;">No file selected</div>
        <button onclick="sendDoc()">Send Document</button>
        <button onclick="logout()" style="margin-top: 10px;">Logout</button>

        <div id="msg" class="msg" style="display:none"></div>
    </div>

    <script>
        function checkAccess() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "doctor") {
                window.location.href = 'index.html';
            }
        }

        checkAccess();

        function showSelectedFile() {
            const fileInput = document.getElementById("file");
            const selectedFileDiv = document.getElementById("selected-file");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];

                selectedFileDiv.innerHTML = `
            <strong>Selected file:</strong> ${file.name}<br>
            <span style="font-size:12px;color:#777;">
                Size: ${(file.size / 1024).toFixed(2)} KB | Type: ${file.type || "Unknown"}
            </span>
        `;
            } else {
                selectedFileDiv.textContent = "No file selected";
            }
        }
        async function sendDoc() {
            const token = localStorage.getItem("token");
            const receiver_id = document.getElementById('receiver_id').value;
            const fileInput = document.getElementById('file');
            const m = document.getElementById('msg');

            m.style.display = 'block';

            if (!receiver_id || !fileInput || !fileInput.files || fileInput.files.length === 0) {
                m.className = 'msg error';
                m.textContent = 'Please select a patient and document';
                return;
            }

            const formData = new FormData();
            formData.append("receiver_id", receiver_id);
            formData.append("file", fileInput.files[0]);
            const res = await fetch(
                `http://127.0.0.1:8000/send-document`,
                { method: 'POST', headers: { "Authorization": `Bearer ${token}` }, body: formData }
            );

            const data = await res.json();
            m.className = 'msg ' + (res.ok ? 'success' : 'error');
            m.textContent = res.ok ? 'Encrypted document sent successfully' : (data.detail || 'Error sending document');
        }

        async function logout() {
            const token = localStorage.getItem("token");

            await fetch("http://127.0.0.1:8000/logout",
                { method: 'POST', headers: { 'accept': 'application/json', "Authorization": `Bearer ${token}` } }
            );
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
